
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LV Auto Trader V3</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .panel {
      background: #1e293b;
      padding: 20px;
      border-radius: 14px;
      margin-top: 20px;
    }
    button {
      padding: 14px;
      background: #16a34a;
      color: white;
      border: 0;
      border-radius: 8px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>LV AUTO TRADER V3</h1>
  <p>AI Trading Chart Analyzer</p>

  <div class="panel">
    <h3>Upload your trading screenshot</h3>
    <input type="file" accept="image/*">
    <p>Supported platforms: Olymp Trade and MT5</p>
  </div>

  <div class="panel">
    <h3>Analysis status</h3>
    <p>AI connection: Not connected</p>
    <p>Trading signals: Not active</p>
    <button id="analyzeButton"Analyze Chart</button>
  </div>
<script>
const imageInput = document.getElementById("chartImage");
const analyzeButton = document.getElementById("analyzeButton");
analyzeButton.addEventListener("click", async () => {
  const file = imageInput.files[0];

  if (!file) {
    alert("Please upload a chart screenshot first.");
    return;
  }

  analyzeButton.disabled = true;
  analyzeButton.textContent = "Analyzing...";
  const reader = new FileReader();

reader.onload = async () => {
  try {
    const response = await fetch("/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image: reader.result
      })
    });

    const data = await response.json();

    const result = document.createElement("p");
    result.textContent = data.analysis || data.error || "No result received.";

    analyzeButton.parentElement.appendChild(result);

  } catch (error) {
    alert("Could not connect to the AI server.");
  } finally {
    analyzeButton.disabled = false;
    analyzeButton.textContent = "Analyze Chart";
  }
};

reader.readAsDataURL(file);
});
</script>
</body>
</html>
